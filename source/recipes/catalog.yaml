schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: '1.0'
kind: RecipeCatalog
recipeCatalog:
  metadata:
    id: RCP-CATALOG-001
    name:
      en: ODPR Example Recipe Catalog
    description:
      en: Metadata-only discovery catalog for canonical ODPR recipe examples.
  version: 1.0.0
  groups:
    - id: examples
      name:
        en: Example Recipes
      description:
        en: Complete learning and demonstration recipes.
  recipes:
    - path: recipes/examples/minimal.yaml
      id: RCP-DEV-001
      groupRef: examples
      version: 1.0.0
      type: dev
      name:
        en: Local Fragment Draft
      description:
        en: Generate draft ODPC fragments locally for fast iteration.
      executionMode: local
      providerRef: local-fast
      commands:
        - generate
    - path: recipes/examples/ci-validate-generated-fragments.yaml
      id: RCP-CI-001
      groupRef: examples
      version: 1.0.0
      type: ci
      name:
        en: CI Validate Generated Fragments
      description:
        en: Generate and validate draft fragments during CI.
      requiresReview: false
      commands:
        - generate
        - validate
    - path: recipes/examples/release-portfolio-review.yaml
      id: RCP-RELEASE-001
      groupRef: examples
      version: 1.0.0
      type: release
      name:
        en: Release Portfolio Review
      description:
        en: Refresh, localize, and explain a portfolio for release review.
      executionMode: hosted
      providerRef: production-quality
      requiresReview: true
      commands:
        - portfolio.refresh
        - portfolio.localize
        - portfolio.explain
    - path: recipes/examples/portfolio-localization.yaml
      id: RCP-LOCALIZATION-001
      groupRef: examples
      version: 1.0.0
      type: localization
      name:
        en: Portfolio Localization
      description:
        en: Localize a portfolio workspace into configured target languages.
      executionMode: hosted
      providerRef: production-quality
      requiresReview: true
      commands:
        - portfolio.localize
    - path: recipes/examples/hybrid-graph-review.yaml
      id: RCP-HYBRID-001
      groupRef: examples
      version: 1.0.0
      type: hybrid
      name:
        en: Hybrid Graph Review
      description:
        en: Infer graph context locally and review the portfolio with a hosted model.
      executionMode: hybrid
      requiresReview: true
      commands:
        - odpg.build
        - generate
        - portfolio.explain
    - path: recipes/examples/data-product-delivery.yaml
      id: RCP-DATA-PRODUCT-001
      groupRef: examples
      version: 1.0.0
      type: agent
      name:
        en: Data Product Recipe Delivery
      scope: data-product
      description:
        en: Generate a reviewable Data Product Recipe for one data product.
      requiresReview: true
      commands:
        - explain
        - generate
        - validate
    - path: recipes/examples/graph-triggered-impact-review.yaml
      id: RCP-GRAPH-001
      groupRef: examples
      version: 1.0.0
      type: agent
      name:
        en: Graph Triggered Impact Review
      scope: graph
      description:
        en: Review graph impact when a node status changes to production.
      executionMode: hosted
      providerRef: production-quality
      requiresReview: true
      commands:
        - generate
