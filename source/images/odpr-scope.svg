<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ODPR root objects and standards family boundary</title>
  <desc id="desc">Conceptual illustration showing ODPR defining Recipe, Provider, RecipeCatalog, and DataProductRecipe around ODPS, ODPC, ODPG, and ODPV artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fa"/>
      <stop offset="1" stop-color="#fff4f7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f001f"/>
      <stop offset="1" stop-color="#35004f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#35000c" flood-opacity="0.14"/>
    </filter>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #230336; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #5f4854; }
      .card-title { font-size: 22px; font-weight: 700; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .white { fill: #ffffff; }
      .muted { fill: #6b4b55; }
      .object-card { fill: #ffffff; stroke: #c97a7e; stroke-width: 1.7; }
      .family-card { fill: #fff8fa; stroke: #e3b8c2; stroke-width: 1.5; }
      .connector { fill: none; stroke: #c97a7e; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 8 9; }
      .solid { fill: none; stroke: #8f001f; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="26" fill="url(#bg)"/>
  <rect x="42" y="42" width="1116" height="636" rx="24" fill="#ffffff" stroke="#ead2d8"/>

  <text x="82" y="96" class="label title">What ODPR Defines</text>
  <text x="82" y="128" class="label subtitle">Four ODPR root objects standardize workflow, runtime profile, discovery, and handoff around data product artifacts.</text>

  <rect x="432" y="186" width="336" height="156" rx="24" fill="url(#core)" filter="url(#shadow)"/>
  <text x="600" y="244" text-anchor="middle" class="label card-title white">ODPR Specification</text>
  <text x="600" y="278" text-anchor="middle" class="label small white">portable delivery contracts</text>
  <line x1="492" y1="300" x2="708" y2="300" stroke="#ffffff" stroke-opacity="0.45"/>
  <text x="600" y="326" text-anchor="middle" class="label tiny white">validated by odpr.yaml or odpr.json</text>

  <path class="connector" d="M432 232 C410 224 400 224 378 224"/>
  <path class="connector" d="M432 318 C392 352 402 467 378 467"/>
  <path class="connector" d="M768 232 C790 224 800 224 822 224"/>
  <path class="connector" d="M768 318 C808 352 798 467 822 467"/>

  <rect x="86" y="162" width="292" height="150" rx="18" class="object-card"/>
  <text x="116" y="204" class="label card-title">Recipe</text>
  <text x="116" y="236" class="label small muted">Workflow intent</text>
  <text x="116" y="266" class="label tiny">steps, inputs, outputs</text>
  <text x="116" y="290" class="label tiny">gates, execution, review</text>

  <rect x="86" y="392" width="292" height="150" rx="18" class="object-card"/>
  <text x="116" y="434" class="label card-title">Provider</text>
  <text x="116" y="466" class="label small muted">Named runtime profile</text>
  <text x="116" y="496" class="label tiny">provider family, model</text>
  <text x="116" y="520" class="label tiny">credentialsRef, defaults</text>

  <rect x="822" y="162" width="292" height="150" rx="18" class="object-card"/>
  <text x="852" y="204" class="label card-title">RecipeCatalog</text>
  <text x="852" y="236" class="label small muted">Discovery index</text>
  <text x="852" y="266" class="label tiny">metadata-only list</text>
  <text x="852" y="290" class="label tiny">links to full recipes</text>

  <rect x="822" y="392" width="292" height="150" rx="18" class="object-card"/>
  <text x="852" y="434" class="label card-title">DataProductRecipe</text>
  <text x="852" y="466" class="label small muted">Handoff manifest</text>
  <text x="852" y="496" class="label tiny">required core files</text>
  <text x="852" y="520" class="label tiny">readiness and review state</text>

  <path class="solid" d="M230 574 H970"/>
  <text x="600" y="606" text-anchor="middle" class="label small muted">ODPR works around other standards, without redefining them</text>

  <g>
    <rect x="172" y="626" width="150" height="38" rx="19" class="family-card"/>
    <text x="247" y="651" text-anchor="middle" class="label tiny">ODPS product</text>
    <rect x="366" y="626" width="150" height="38" rx="19" class="family-card"/>
    <text x="441" y="651" text-anchor="middle" class="label tiny">ODPC catalog</text>
    <rect x="560" y="626" width="150" height="38" rx="19" class="family-card"/>
    <text x="635" y="651" text-anchor="middle" class="label tiny">ODPG graph</text>
    <rect x="754" y="626" width="150" height="38" rx="19" class="family-card"/>
    <text x="829" y="651" text-anchor="middle" class="label tiny">ODPV terms</text>
  </g>
</svg>
